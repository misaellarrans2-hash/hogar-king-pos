{% extends "base.html" %}
{% block title %}Iniciar sesion - Hogar King POS{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <div class="text-center mb-4">
      <h1 class="fw-bold" style="color:#7a1f1f;">Hogar King POS</h1>
      <p class="text-muted">Sede Centro &middot; Sede La Lucha</p>
    </div>
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form method="post">
          <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input type="text" class="form-control form-control-lg" id="username" name="username" required autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control form-control-lg" id="password" name="password" required>
          </div>
          <button type="submit" class="btn btn-lg w-100 text-white" style="background-color:#7a1f1f;">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
